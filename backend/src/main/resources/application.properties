# ---- App ----
spring.application.name=districtfunds
server.port=8080

# ---- Database ----
# ${NAME:default} means "use env var NAME, or the default if it isn't set".
# Defaults work for local dev. Docker Compose will override DB_HOST later.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:districtfunds}
spring.datasource.username=${DB_USERNAME:districtfunds}
# No default on purpose: the password must come from the environment.
spring.datasource.password=${DB_PASSWORD}

# ---- JPA / Hibernate ----
# "update" creates and alters tables to match the entity classes. Fine for this project.
spring.jpa.hibernate.ddl-auto=update
# Keeps database work inside the service layer instead of leaking into web requests.
spring.jpa.open-in-view=false
# Flip to true when you want to see the SQL Hibernate runs.
spring.jpa.show-sql=false

# ---- FEC API ----
# No default on purpose: the key must come from the environment, never from this file.
fec.api-key=${FEC_API_KEY}
fec.base-url=https://api.open.fec.gov/v1
# Employer rows per request (the FEC max is 100).
fec.page-size=100
# How many pages of raw employers to pull per committee (5 x 100 = 500 rows).
fec.max-employer-pages=5

# ---- App behavior ----
app.default-cycle=2026
# Re-fetch from the FEC when saved data is older than this.
app.cache-hours=24
# The Vite dev server, allowed to call this API from the browser.
app.cors.allowed-origin=http://localhost:5173
